# Scheduled empty commits so you do not have to push manually. Each push triggers
# `pages-deploy.yml` (deploys to GitHub Pages).
#
# Required secret:
#   SCHEDULED_COMMIT_TOKEN — fine-grained PAT: Contents = Read and write on this repo
#   (classic PAT: `repo` scope). Pushes must use a PAT, not the default GITHUB_TOKEN,
#   or GitHub will not start other workflows on that push.
#
# Failure alerts:
#   The `notify` job opens an issue, which triggers GitHub notifications. Enable email
#   for “Issues” at https://github.com/settings/notifications

name: Scheduled refresh commit

on:
  schedule:
    # ~every two weeks: 00:00 UTC on the 1st and 15th
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scheduled-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Require push token
        env:
          TOKEN: ${{ secrets.SCHEDULED_COMMIT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Create a fine-grained PAT with Contents read/write on this repo and add it as the repository secret SCHEDULED_COMMIT_TOKEN."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.SCHEDULED_COMMIT_TOKEN }}

      - name: Create empty commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: scheduled site refresh"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  notify:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[CI] Scheduled refresh failed (${new Date().toISOString().slice(0, 10)})`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled empty-commit workflow failed.`,
              ``,
              `- **Run:** ${runUrl}`,
              ``,
              `If GitHub notifications include **Issues** by email, you should get a message for this issue.`,
              `(See https://github.com/settings/notifications )`,
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
